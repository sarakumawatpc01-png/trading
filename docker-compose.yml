services:
  backend:
    build: ./backend
    environment:
      BACKEND_PORT: 8080
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      PYTHON_SERVICE_URL: http://python-service:8000
      USE_INMEMORY_QUEUE: "false"
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - clickhouse
      - python-service

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080/api
      NEXT_PUBLIC_WS_BASE: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  python-service:
    build: ./python-service
    environment:
      BACKEND_URL: http://backend:8080
      PREFILTER_INTERVAL_SEC: 15
    ports:
      - "8000:8000"

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
